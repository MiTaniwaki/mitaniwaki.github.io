---
layout: archive
permalink: /tags/
title: "Posts by Tags"
author_profile: true
---

{% assign sorted_tags = site.tags | sort %}
{% for tag in sorted_tags %}
  <h2 id="{{ tag[0] | slugify }}" class="archive__subtitle">{{ tag[0] }}</h2>
  {% for post in tag[1] %}
    {% include archive-item.html item=post %}
  {% endfor %}
{% endfor %}

locale: "en-US"
title: "Michiki Taniwaki / 谷脇 三千輝"
title_separator: "-"
name: "Michiki Taniwaki"
description: "Academic website of Michiki Taniwaki"
url: "https://mitaniwaki.github.io"
baseurl: ""
repository: "MiTaniwaki/mitaniwaki.github.io"
# Use the local layouts and Sass instead of GitHub Pages' default Primer theme.
theme: null

author:
  avatar: "profile.jpg"
  name: "Michiki Taniwaki"
  bio: "PhD Student"
  location: "Germany"
  email_text: "8219075'ｱｯﾄ'ed.tus.ac.jp"
  researchgate: "https://www.researchgate.net/profile/Michiki-Taniwaki"
  github: "MiTaniwaki"

include:
  - _pages

exclude:
  - .bundle
  - .github
  - .jekyll-cache
  - Dockerfile
  - docker-compose.yaml
  - _config_docker.yml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor

collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/
  news:
    output: true
    permalink: /news/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: talks
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: news
    values:
      layout: single
      author_profile: true

kramdown:
  input: GFM

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Etc/UTC

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

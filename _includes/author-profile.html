{% assign author = site.author %}
<div itemscope itemtype="https://schema.org/Person">
  <div class="author__avatar">
    <img src="{{ author.avatar | prepend: '/images/' | relative_url }}" class="author__avatar" alt="{{ author.name }}">
  </div>

  <div class="author__content">
    <h3 class="author__name">{{ author.name }}</h3>
    <p class="author__bio">{{ author.bio }}</p>
  </div>

  <div class="author__urls-wrapper">
    <button class="btn btn--inverse" aria-expanded="false">Follow</button>
    <ul class="author__urls social-icons">
      <li class="author__desktop"><i class="fa-solid fa-location-dot icon-pad-right" aria-hidden="true"></i>{{ author.location }}</li>
      <li><i class="fa-solid fa-envelope icon-pad-right" aria-hidden="true"></i>{{ author.email_text }}</li>
      <li><a href="{{ author.researchgate }}"><i class="fa-brands fa-researchgate icon-pad-right" aria-hidden="true"></i>ResearchGate</a></li>
      <li><a href="https://github.com/{{ author.github }}"><i class="fa-brands fa-github icon-pad-right" aria-hidden="true"></i>GitHub</a></li>
    </ul>
  </div>
</div>
